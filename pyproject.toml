[project]
name = "opd-subliminal-learning"
version = "0.1.0"
description = "Testing subliminal learning with on-policy distillation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tinker",
    "tinker-cookbook",  # the [inkling] extra was absorbed into the base package (gone in 0.5.5)
    "numpy",
    "matplotlib>=3.10.9",
    "scipy>=1.17.1",
    "anthropic>=0.102.0",
]

[tool.ruff]
extend-exclude = ["archive"]
